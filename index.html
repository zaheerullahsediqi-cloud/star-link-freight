<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Star Link Freight — Fleet Finance</title>
<link rel="icon" href="data:,">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#0f1720; --panel:#16212c; --panel2:#1c2a37; --border:#28394a;
  --text:#e8eef4; --muted:#93a5b8; --accent:#3aa0ff; --accent2:#28c98d;
  --danger:#ff5d6c; --warn:#f5b83d; --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
a{color:var(--accent)}
input,select,textarea,button{font-family:inherit;font-size:15px}
.hidden{display:none !important}

/* ---------- top bar ---------- */
header.topbar{
  position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#101c26,#0f1720 90%);
  border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
header.topbar h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
header.topbar h1 span{color:var(--muted);font-weight:500;font-size:12px;display:block;margin-top:2px}
.lockbtn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer}

nav.tabs{display:flex;gap:4px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:57px;z-index:19}
nav.tabs button{background:none;border:none;color:var(--muted);padding:9px 14px;border-radius:9px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:13.5px}
nav.tabs button.active{background:var(--accent);color:#fff}
nav.tabs button .tab-icon{display:none}
nav.tabs button .tab-label{display:none}
nav.tabs button .tab-label-desktop{display:inline}

main{padding:16px;max-width:1100px;margin:0 auto;padding-bottom:90px}

/* ---------- mobile bottom tab bar (native-app style) ---------- */
@media(max-width:700px){
  nav.tabs{
    position:fixed;left:0;right:0;top:auto;bottom:0;
    display:flex;gap:0;justify-content:space-around;
    padding:6px 2px calc(6px + env(safe-area-inset-bottom));
    background:var(--panel);border-bottom:none;border-top:1px solid var(--border);
    box-shadow:0 -2px 12px rgba(0,0,0,.25);overflow-x:visible;z-index:30;
  }
  nav.tabs button{
    flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    padding:4px 2px;border-radius:8px;white-space:normal;
  }
  nav.tabs button.active{background:none;color:var(--accent)}
  nav.tabs button .tab-icon{display:block;font-size:18px;line-height:1}
  nav.tabs button .tab-label{display:block;font-size:9.5px;line-height:1.15;font-weight:600;text-align:center}
  nav.tabs button .tab-label-desktop{display:none}
  main{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
}

/* ---------- cards / layout ---------- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.grid>*{min-width:0}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:760px){.grid.cols-3,.grid.cols-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.grid.cols-2{grid-template-columns:1fr}}
.stat{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.stat .label{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.stat .value{font-size:20px;font-weight:700}
.stat .value.pos{color:var(--accent2)}
.stat .value.neg{color:var(--danger)}

h2.section{font-size:15px;margin:0 0 12px;color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:8px}
h2.section small{color:var(--muted);font-weight:500}

table{width:100%;border-collapse:collapse;font-size:13.5px}
table th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;padding:8px 8px;border-bottom:1px solid var(--border)}
table td{padding:9px 8px;border-bottom:1px solid var(--border)}
table tr:last-child td{border-bottom:none}
table.compact td,table.compact th{padding:6px 8px}
.tbl-wrap{overflow-x:auto}
.right{text-align:right}
.center{text-align:center}
.muted{color:var(--muted)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.badge.ok{background:rgba(40,201,141,.15);color:var(--accent2)}
.badge.bad{background:rgba(255,93,108,.15);color:var(--danger)}

button.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
button.btn.secondary{background:var(--panel2);border:1px solid var(--border);color:var(--text)}
button.btn.danger{background:rgba(255,93,108,.15);color:var(--danger);border:1px solid rgba(255,93,108,.3)}
button.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
button.icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:4px 6px}
button.icon-btn:hover{color:var(--text)}
.row-actions{display:flex;gap:4px;justify-content:flex-end}

.truck-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.truck-card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:.15s}
.truck-card:hover{border-color:var(--accent)}
.truck-card .name{font-weight:700;margin-bottom:4px}
.truck-card .meta{color:var(--muted);font-size:12px}

/* ---------- responsive card layouts (mobile) ---------- */
.desktop-table{display:block}
.mobile-cards{display:none}
@media(max-width:700px){
  .desktop-table{display:none}
  .mobile-cards{display:block}
}
.balance-card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.balance-card:last-child{margin-bottom:0}
.balance-card.total-card{border-color:var(--accent)}
.balance-card-name{font-weight:700;margin-bottom:8px}
.balance-card-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:13.5px}
.balance-card-row.total{border-top:1px solid var(--border);margin-top:4px;padding-top:8px;font-weight:700}
.load-card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.load-card:last-child{margin-bottom:0}
.load-card-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.load-card-num{font-weight:700}
.load-card-date{color:var(--muted);font-size:12.5px}
.load-card-top .badge{margin-left:auto}
.load-card-route{font-weight:600;margin-bottom:8px}
.load-card-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}
.load-card-rate{font-weight:700}
.expense-name{display:block}
@media(max-width:700px){
  .expense-name{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}

label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;margin-top:10px;font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:9px 10px;border-radius:8px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.field-row{grid-template-columns:1fr}}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,10,14,.7);display:flex;align-items:flex-end;justify-content:center;z-index:100}
@media(min-width:700px){.overlay{align-items:center}}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px 14px 0 0;padding:20px;width:100%;max-width:480px;max-height:88vh;overflow:auto}
@media(min-width:700px){.modal{border-radius:14px}}
.modal h3{margin:0 0 4px;font-size:16px}
.modal .close-x{float:right;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* ---------- setup / lock screens ---------- */
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.setup-box{max-width:520px;width:100%;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px}
.setup-box h2{margin-top:0}
.setup-box textarea{min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.steps{color:var(--muted);font-size:13.5px;line-height:1.6}
.steps ol{padding-left:20px}
.pin-dots{display:flex;gap:12px;justify-content:center;margin:20px 0}
.pin-dots div{width:16px;height:16px;border-radius:50%;border:2px solid var(--border)}
.pin-dots div.filled{background:var(--accent);border-color:var(--accent)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c2a37;border:1px solid var(--border);padding:10px 18px;border-radius:10px;z-index:200;font-size:13.5px}
.toast.err{border-color:var(--danger);color:var(--danger)}
.toast.ok{border-color:var(--accent2);color:var(--accent2)}

.import-summary{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:13px;margin-top:10px}
.small-link{font-size:12.5px;color:var(--muted);text-decoration:underline;cursor:pointer;background:none;border:none;padding:0}
</style>
</head>
<body>

<div id="root"></div>

<script>
/* =========================================================================
   STAR LINK FREIGHT — FLEET FINANCE APP
   Single-file web app. Data lives in Firebase Firestore (bring-your-own
   project, pasted in on first run) so it syncs live between phone & PC.
   ========================================================================= */

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const LS_CONFIG = "slf_firebase_config";
const LS_UNLOCK = "slf_unlocked"; // sessionStorage
const LS_PIN_ATTEMPTS = "slf_pin_attempts"; // sessionStorage
const LS_PIN_LOCK_UNTIL = "slf_pin_lock_until"; // sessionStorage, epoch ms
const PIN_LOCKOUT_MS = 30000;
const PIN_MAX_ATTEMPTS = 5;

let app, db;
let state = {
  ready:false,
  settings:{ factoringRate:0.0225, companyGrossDefault:0.10, perInvoiceFee:1.85, shareholders:[], trucks:[], statusOptions:["Delivered","Cancelled (TONU)"], pinHash:null },
  loads:[],       // {id, truck, number, date(Timestamp|null), pickup, destination, rate, status, month, notes, year}
  expenses:[],    // {id, month, expense, amount, frequency}
  draws:[],       // {id, date, shareholder, amount, note}
  tab:"dashboard",
  currentTruck:null,
  dashYear:null,
  dashMonth:"July",
  allLoadsFilter:{ truck:'', from:'', to:'', route:'' },
};

const root = document.getElementById('root');

/* ---------------------------------------------------------------------
   BOOT
   --------------------------------------------------------------------- */
function boot(){
  const cfg = localStorage.getItem(LS_CONFIG);
  if(!cfg){ renderSetupScreen(); return; }
  try{
    const parsed = JSON.parse(cfg);
    initFirebase(parsed);
  }catch(e){
    renderSetupScreen("Saved connection looked corrupted. Please paste your Firebase config again.");
  }
}

function initFirebase(cfg){
  try{
    app = firebase.initializeApp(cfg);
    db = firebase.firestore();
  }catch(e){
    renderSetupScreen("Could not connect: "+e.message);
    return;
  }
  attachListeners();
  renderAppShell();
}

function attachListeners(){
  db.collection('meta').doc('settings').onSnapshot(doc=>{
    if(doc.exists){
      const d = doc.data();
      state.settings = Object.assign({}, state.settings, d);
      migrateTruckIds();
    }
    state.ready = true;
    if(!state.dashYear) state.dashYear = new Date().getFullYear();
    checkLockAndRender();
  }, err=>toast("Firestore error: "+err.message,'err'));

  db.collection('loads').onSnapshot(snap=>{
    state.loads = snap.docs.map(d=>({id:d.id, ...d.data()}));
    checkLockAndRender();
  }, err=>toast("Firestore error (loads): "+err.message,'err'));

  db.collection('expenses').onSnapshot(snap=>{
    state.expenses = snap.docs.map(d=>({id:d.id, ...d.data()}));
    checkLockAndRender();
  }, err=>toast("Firestore error (expenses): "+err.message,'err'));

  db.collection('draws').onSnapshot(snap=>{
    state.draws = snap.docs.map(d=>({id:d.id, ...d.data()}));
    checkLockAndRender();
  }, err=>toast("Firestore error (draws): "+err.message,'err'));
}

let renderScheduled=false;
function checkLockAndRender(){
  if(renderScheduled) return;
  renderScheduled=true;
  requestAnimationFrame(()=>{ renderScheduled=false; renderApp(); });
}

/* ---------------------------------------------------------------------
   SETUP SCREEN (first run — paste Firebase config)
   --------------------------------------------------------------------- */
function renderSetupScreen(errMsg){
  root.innerHTML = `
  <div class="center-screen">
    <div class="setup-box">
      <h2>Connect your database</h2>
      <p class="steps">This app stores its data in a free Firebase project you control, so the same data shows up on your phone and PC. Takes about 5 minutes the first time.</p>
      <div class="steps">
        <ol>
          <li>Go to <a href="https://console.firebase.google.com" target="_blank" rel="noopener">console.firebase.google.com</a> and create a project (any name, e.g. "Star Link Freight").</li>
          <li>In the project, open <b>Build → Firestore Database</b> → Create database → start in <b>test mode</b> (you can lock it down later, see the setup guide).</li>
          <li>Click the gear icon → <b>Project settings</b> → scroll to "Your apps" → click the &lt;/&gt; (Web) icon → register an app (no need for hosting).</li>
          <li>Copy the <code>firebaseConfig</code> object it shows you and paste it below.</li>
        </ol>
      </div>
      ${errMsg?`<p style="color:var(--danger);font-size:13px">${escapeHtml(errMsg)}</p>`:""}
      <label>Paste your firebaseConfig here</label>
      <textarea id="cfgInput" placeholder='{
  apiKey: "...",
  authDomain: "...",
  projectId: "...",
  storageBucket: "...",
  messagingSenderId: "...",
  appId: "..."
}'></textarea>
      <div class="modal-actions">
        <button class="btn" id="connectBtn">Connect</button>
      </div>
    </div>
  </div>`;
  document.getElementById('connectBtn').onclick=()=>{
    const raw = document.getElementById('cfgInput').value.trim();
    if(!raw){ toast("Paste your Firebase config first.","err"); return; }
    let cfg;
    try{
      cfg = parseLenientObject(raw);
    }catch(e){
      renderSetupScreen("Couldn't read that config — check it's the object Firebase gave you, e.g. { apiKey: \"...\", projectId: \"...\", ... }");
      return;
    }
    if(!cfg.apiKey || !cfg.projectId){
      renderSetupScreen("That doesn't look like a complete config — it needs at least apiKey and projectId.");
      return;
    }
    localStorage.setItem(LS_CONFIG, JSON.stringify(cfg));
    initFirebase(cfg);
  };
}

function parseLenientObject(raw){
  let txt = raw.trim();
  // Normalize smart/curly quotes to straight quotes (common when pasting from
  // phone keyboards, Notes apps, or messaging apps that auto-convert them).
  txt = txt.replace(/[\u201C\u201D]/g, '"').replace(/[\u2018\u2019]/g, "'");
  txt = txt.replace(/^\s*(const|var|let)\s+\w+\s*=\s*/,'');
  txt = txt.replace(/;\s*$/,'');
  // eslint-disable-next-line no-new-func
  const fn = new Function('return (' + txt + ')');
  return fn();
}

/* ---------------------------------------------------------------------
   PIN LOCK
   --------------------------------------------------------------------- */
async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function isLocked(){
  return !!state.settings.pinHash && sessionStorage.getItem(LS_UNLOCK) !== '1';
}

let pinBuffer = "";
let pinLockTimer = null;
function pinLockRemainingMs(){
  const until = Number(sessionStorage.getItem(LS_PIN_LOCK_UNTIL)||0);
  return Math.max(0, until - Date.now());
}
function renderLockScreen(){
  if(pinLockTimer){ clearInterval(pinLockTimer); pinLockTimer=null; }
  const remaining = pinLockRemainingMs();
  if(remaining>0){
    root.innerHTML = `
    <div class="center-screen">
      <div class="setup-box" style="text-align:center">
        <h2>Enter PIN</h2>
        <p class="muted" style="font-size:13px">Star Link Freight — Fleet Finance</p>
        <p style="color:var(--danger);font-size:14px;margin-top:24px;line-height:1.6">Too many incorrect attempts.<br>Try again in <b id="pinLockSecs">${Math.ceil(remaining/1000)}</b>s.</p>
      </div>
    </div>`;
    pinLockTimer = setInterval(()=>{
      const r = pinLockRemainingMs();
      if(r<=0){
        clearInterval(pinLockTimer); pinLockTimer=null;
        sessionStorage.removeItem(LS_PIN_LOCK_UNTIL);
        renderLockScreen();
      } else {
        const el = document.getElementById('pinLockSecs');
        if(el) el.textContent = Math.ceil(r/1000);
      }
    }, 500);
    return;
  }
  root.innerHTML = `
  <div class="center-screen">
    <div class="setup-box" style="text-align:center">
      <h2>Enter PIN</h2>
      <p class="muted" style="font-size:13px">Star Link Freight — Fleet Finance</p>
      <div class="pin-dots" id="pinDots"></div>
      <div class="grid cols-3" style="max-width:260px;margin:0 auto">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="btn secondary" style="padding:16px 0;font-size:18px" data-pin="${n}">${n}</button>`).join('')}
        <div></div>
        <button class="btn secondary" style="padding:16px 0;font-size:18px" data-pin="0">0</button>
        <button class="btn secondary" style="padding:16px 0" data-pin="back">⌫</button>
      </div>
      <p id="pinErr" style="color:var(--danger);font-size:13px;min-height:18px;margin-top:12px"></p>
    </div>
  </div>`;
  renderPinDots();
  root.querySelectorAll('[data-pin]').forEach(b=>b.onclick=async ()=>{
    const v = b.getAttribute('data-pin');
    if(v==='back'){ pinBuffer = pinBuffer.slice(0,-1); }
    else if(pinBuffer.length<8){ pinBuffer += v; }
    renderPinDots();
    if(pinBuffer.length>=4){
      const hash = await sha256(pinBuffer);
      if(hash === state.settings.pinHash){
        sessionStorage.removeItem(LS_PIN_ATTEMPTS);
        sessionStorage.setItem(LS_UNLOCK,'1');
        pinBuffer="";
        renderApp();
      } else if(pinBuffer.length>=8){
        pinBuffer="";
        const attempts = Number(sessionStorage.getItem(LS_PIN_ATTEMPTS)||0) + 1;
        if(attempts>=PIN_MAX_ATTEMPTS){
          sessionStorage.setItem(LS_PIN_LOCK_UNTIL, String(Date.now()+PIN_LOCKOUT_MS));
          sessionStorage.setItem(LS_PIN_ATTEMPTS, '0');
          renderLockScreen();
        } else {
          sessionStorage.setItem(LS_PIN_ATTEMPTS, String(attempts));
          const left = PIN_MAX_ATTEMPTS-attempts;
          document.getElementById('pinErr').textContent = `Incorrect PIN — ${left} attempt${left===1?'':'s'} left before a 30s lockout`;
          renderPinDots();
        }
      }
    }
  });
}
function renderPinDots(){
  const el = document.getElementById('pinDots');
  if(!el) return;
  el.innerHTML = Array.from({length:Math.max(4,pinBuffer.length)}).map((_,i)=>`<div class="${i<pinBuffer.length?'filled':''}"></div>`).join('');
}

/* ---------------------------------------------------------------------
   APP SHELL + ROUTING
   --------------------------------------------------------------------- */
function renderAppShell(){
  if(!state.ready){
    root.innerHTML = `<div class="center-screen"><p class="muted">Connecting…</p></div>`;
    return;
  }
  renderApp();
}

function renderApp(){
  if(!state.ready) return;
  if(isLocked()){ renderLockScreen(); return; }

  const tabs = [
    ["dashboard","Dashboard","\ud83d\udcca"],
    ["trucks","Trucks","\ud83d\ude9a"],
    ["allloads","All Loads","\ud83d\udccb"],
    ["expenses","Expenses","\ud83e\uddfe"],
    ["draws","Shareholder Draws","\ud83d\udcb0","Draws"],
    ["settings","Settings","\u2699\ufe0f"],
  ];
  root.innerHTML = `
    <header class="topbar">
      <h1>Star Link Freight <span>Fleet Finance</span></h1>
      ${state.settings.pinHash?'<button class="lockbtn" id="lockNowBtn">🔒 Lock</button>':''}
    </header>
    <nav class="tabs">
      ${tabs.map(([id,label,icon,mobileLabel])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}"><span class="tab-icon">${icon}</span><span class="tab-label">${mobileLabel||label}</span><span class="tab-label-desktop">${label}</span></button>`).join('')}
    </nav>
    <main id="mainArea"></main>
    <div id="modalRoot"></div>
    <div id="toastRoot"></div>
  `;
  root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ state.tab=b.getAttribute('data-tab'); state.currentTruck=null; renderApp(); });
  const lockBtn = document.getElementById('lockNowBtn');
  if(lockBtn) lockBtn.onclick=()=>{ sessionStorage.removeItem(LS_UNLOCK); renderApp(); };

  // Keep the active tab (and Settings, which can be scrolled off narrow screens) visibly in view.
  const activeTabBtn = root.querySelector('nav.tabs button.active');
  if(activeTabBtn) activeTabBtn.scrollIntoView({behavior:'auto', inline:'center', block:'nearest'});

  const main = document.getElementById('mainArea');
  if(state.tab==='dashboard') main.innerHTML = renderDashboard();
  else if(state.tab==='trucks') main.innerHTML = state.currentTruck ? renderTruckDetail(state.currentTruck) : renderTrucksList();
  else if(state.tab==='allloads') main.innerHTML = renderAllLoads();
  else if(state.tab==='expenses') main.innerHTML = renderExpenses();
  else if(state.tab==='draws') main.innerHTML = renderDraws();
  else if(state.tab==='settings') main.innerHTML = renderSettings();

  attachTabHandlers();
}

function toast(msg, kind){
  const t = document.createElement('div');
  t.className = 'toast'+(kind?(' '+kind):'');
  t.textContent = msg;
  (document.getElementById('toastRoot')||document.body).appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function money(n){
  n = Number(n)||0;
  const neg = n<0;
  const s = Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (neg?'-':'')+'$'+s;
}
function pct(n){ return (Number(n)*100).toFixed(1).replace(/\.0$/,'')+'%'; }
function fmtDate(v){
  const d = toJsDate(v);
  if(!d) return '';
  return d.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
}
function toJsDate(v){
  if(!v) return null;
  if(v instanceof Date) return v;
  if(v.toDate) return v.toDate(); // Firestore Timestamp
  if(typeof v === 'string'){ const d=new Date(v); return isNaN(d)?null:d; }
  return null;
}
function dateInputVal(v){
  const d = toJsDate(v);
  if(!d) return '';
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

/* =========================================================================
   CALC ENGINE — mirrors the original spreadsheet's formulas exactly.
   NOTE: revenue/gross/net figures include ALL logged loads regardless of
   status (Delivered or Cancelled/TONU) — this matches how the source
   workbook actually computed its totals.
   ========================================================================= */
function truckPct(truckId){
  const t = (state.settings.trucks||[]).find(t=>t.id===truckId);
  return t ? Number(t.pct) : Number(state.settings.companyGrossDefault||0.10);
}
function truckById(truckId){
  return (state.settings.trucks||[]).find(t=>t.id===truckId) || null;
}
function genId(){
  return 't_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
// One-time migration: older trucks were saved without a stable `id` (loads
// linked to them by mutable `name` instead). Assign id = current name so
// every existing load keeps working with zero visible change; from this
// point on, id never changes even if the truck is renamed.
function migrateTruckIds(){
  const trucks = state.settings.trucks||[];
  if(!trucks.length) return;
  if(!trucks.some(t=>!t.id)) return;
  const migrated = trucks.map(t=>t.id ? t : Object.assign({}, t, {id: t.name}));
  saveSettings({trucks: migrated}).catch(err=>toast("Truck ID migration failed: "+err.message,'err'));
}
function loadsForYear(year){
  return state.loads.filter(l=>{
    if(!year) return true;
    if(l.year!=null) return Number(l.year)===year;
    const d = toJsDate(l.date);
    return d ? d.getFullYear()===year : false;
  });
}
function computeMonthStats(monthName, year){
  const pool = loadsForYear(year).filter(l=>l.month===monthName);
  const totalLoads = pool.length;
  const totalGross = pool.reduce((s,l)=>s+(Number(l.rate)||0),0);
  const companyGross = pool.reduce((s,l)=>s+(Number(l.rate)||0)*truckPct(l.truck),0);
  const factoringFee = totalGross * Number(state.settings.factoringRate||0);
  const companyNet = companyGross - factoringFee;
  const invoicesFee = totalLoads * Number(state.settings.perInvoiceFee||0);
  const totalExpenses = state.expenses.filter(e=>e.month===monthName && (!year || !e.year || Number(e.year)===year)).reduce((s,e)=>s+(Number(e.amount)||0),0);
  const netIncome = companyNet - invoicesFee - totalExpenses;
  return {totalLoads,totalGross,companyGross,factoringFee,companyNet,invoicesFee,totalExpenses,netIncome};
}
function computeYearStats(year){
  const agg = {totalLoads:0,totalGross:0,companyGross:0,factoringFee:0,companyNet:0,invoicesFee:0,totalExpenses:0,netIncome:0};
  const perMonth = {};
  for(const m of MONTHS){
    const st = computeMonthStats(m, year);
    perMonth[m]=st;
    for(const k in agg) agg[k]+=st[k];
  }
  return {agg, perMonth};
}
function truckRevenueForMonth(truckId, monthName, year){
  const pool = loadsForYear(year).filter(l=>l.month===monthName && l.truck===truckId);
  return { loads: pool.length, gross: pool.reduce((s,l)=>s+(Number(l.rate)||0),0) };
}
function availableYears(){
  const ys = new Set([new Date().getFullYear()]);
  state.loads.forEach(l=>{ const d=toJsDate(l.date); if(d) ys.add(d.getFullYear()); else if(l.year) ys.add(Number(l.year)); });
  return Array.from(ys).sort((a,b)=>a-b);
}

function renderTrendChart(perMonth, year, activeMonth){
  const values = MONTHS.map(mo=>perMonth[mo].netIncome);
  const maxAbs = Math.max(1, ...values.map(v=>Math.abs(v)));
  const W = 700, H = 200, padTop = 10, padBottom = 26, padSide = 10;
  const chartH = H - padTop - padBottom;
  const zeroY = padTop + chartH/2;
  const colW = (W - padSide*2) / MONTHS.length;
  const barW = colW * 0.6;
  const bars = MONTHS.map((mo,i)=>{
    const v = values[i];
    const h = (Math.abs(v)/maxAbs) * (chartH/2 - 4);
    const x = padSide + i*colW + (colW-barW)/2;
    const y = v>=0 ? zeroY - h : zeroY;
    const isActive = mo===activeMonth;
    const color = v>=0 ? 'var(--accent2)' : 'var(--danger)';
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" rx="2" style="fill:${color};opacity:${isActive?1:0.55}"><title>${mo} ${year}: ${money(v)}</title></rect>
      <text x="${(x+barW/2).toFixed(1)}" y="${H-8}" text-anchor="middle" style="fill:var(--muted);font-size:9px">${mo.slice(0,1)}</text>`;
  }).join('');
  return `
  <div class="card">
    <h2 class="section">Net income trend <small>${year}</small></h2>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      <line x1="${padSide}" y1="${zeroY.toFixed(1)}" x2="${W-padSide}" y2="${zeroY.toFixed(1)}" style="stroke:var(--border);stroke-width:1"/>
      ${bars}
    </svg>
  </div>`;
}

function openLoadModal(truckId, loadId){
  const editing = loadId ? state.loads.find(l=>l.id===loadId) : null;
  const truck = truckId ? truckById(truckId) : null;
  const truckName = truck ? truck.name : '(unknown truck)';
  const statusOpts = state.settings.statusOptions||["Delivered","Cancelled (TONU)"];
  const trucks = state.settings.trucks||[];
  const truckSelectHtml = truckId
    ? ''
    : `<div><label>Truck</label><select name="truck" required>${trucks.map(t=>`<option value="${escapeHtml(t.id)}" ${editing&&editing.truck===t.id?'selected':''}>${escapeHtml(t.name)}</option>`).join('')}</select></div>`;
  const pickupOptions = [...new Set(state.loads.map(l=>l.pickup).filter(Boolean))].sort();
  const destOptions = [...new Set(state.loads.map(l=>l.destination).filter(Boolean))].sort();
  showModal(`
    <h3>${editing?'Edit load':'Add load'}${truckId?' — '+escapeHtml(truckName):''}</h3>
    <form id="loadForm">
      ${truckSelectHtml}
      <div class="field-row">
        <div><label>Load #</label><input type="number" name="number" value="${editing?editing.number:(truckId?(Math.max(0,...state.loads.filter(l=>l.truck===truckId).map(l=>l.number||0))+1):1)}"></div>
        <div><label>Date</label><input type="date" name="date" required value="${editing?dateInputVal(editing.date):''}"></div>
      </div>
      <div class="field-row">
        <div><label>Pickup</label><input type="text" name="pickup" list="pickupOptionsDL" value="${editing?escapeHtml(editing.pickup):''}" placeholder="e.g. TX"></div>
        <div><label>Destination</label><input type="text" name="destination" list="destOptionsDL" value="${editing?escapeHtml(editing.destination):''}" placeholder="e.g. CA"></div>
      </div>
      <datalist id="pickupOptionsDL">${pickupOptions.map(p=>`<option value="${escapeHtml(p)}">`).join('')}</datalist>
      <datalist id="destOptionsDL">${destOptions.map(p=>`<option value="${escapeHtml(p)}">`).join('')}</datalist>
      <div class="field-row">
        <div><label>Rate ($)</label><input type="number" step="0.01" min="0.01" name="rate" required value="${editing?editing.rate:''}"></div>
        <div><label>Status</label><select name="status">${statusOpts.map(s=>`<option ${editing&&editing.status===s?'selected':''}>${escapeHtml(s)}</option>`).join('')}</select></div>
      </div>
      <div class="field-row">
        <div><label>Month</label><select name="month" required>${MONTHS.map(mo=>`<option ${editing?editing.month===mo:mo===currentMonthName()}${editing&&editing.month===mo?' selected':''}>${mo}</option>`).join('')}</select></div>
        <div><label>Notes</label><input type="text" name="notes" value="${editing?escapeHtml(editing.notes||''):''}"></div>
      </div>
      <p id="loadFormErr" style="color:var(--danger);font-size:13px;min-height:16px"></p>
      <div class="modal-actions">
        <button type="button" class="btn secondary" id="cancelModal">Cancel</button>
        <button type="submit" class="btn">Save</button>
      </div>
    </form>
  `);
  document.getElementById('loadForm').onsubmit = async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const errEl = document.getElementById('loadFormErr');
    const targetTruckId = truckId || fd.get('truck');
    const dateVal = fd.get('date');
    const rateVal = Number(fd.get('rate'))||0;
    const monthVal = fd.get('month');
    if(!targetTruckId){ errEl.textContent = 'Please choose a truck.'; return; }
    if(!dateVal){ errEl.textContent = 'Date is required.'; return; }
    if(!(rateVal>0)){ errEl.textContent = 'Rate must be greater than $0.'; return; }
    if(!monthVal){ errEl.textContent = 'Month is required.'; return; }
    const parsedDate = new Date(dateVal+'T00:00:00');
    const payload = {
      truck: targetTruckId,
      number: Number(fd.get('number'))||0,
      date: firebase.firestore.Timestamp.fromDate(parsedDate),
      year: parsedDate.getFullYear(),
      pickup: fd.get('pickup')||'',
      destination: fd.get('destination')||'',
      rate: rateVal,
      status: fd.get('status'),
      month: monthVal,
      notes: fd.get('notes')||'',
    };
    try{
      if(editing) await db.collection('loads').doc(editing.id).update(payload);
      else await db.collection('loads').add(payload);
      closeModal();
    }catch(err){ toast("Save failed: "+err.message,'err'); }
  };
  document.getElementById('cancelModal').onclick = closeModal;
}

  }
  if(f.from){
    const fromD = new Date(f.from+'T00:00:00');
    list = list.filter(l=>{ const d=toJsDate(l.date); return d ? d>=fromD : false; });
  }
  if(f.to){
    const toD = new Date(f.to+'T23:59:59');
    list = list.filter(l=>{ const d=toJsDate(l.date); return d ? d<=toD : false; });
  }
  list.sort((a,b)=>{
    const da=toJsDate(a.date), db_=toJsDate(b.date);
    if(da && db_) return db_-da;
    return (b.number||0)-(a.number||0);
  });
  return list.map(l=>Object.assign({}, l, {truckName: truckNameMap.get(l.truck) || '(unknown truck)'}));
}

/* =========================================================================
   SHAREHOLDER DRAWS
   ========================================================================= */
function renderDraws(){
  const year = state.dashYear || new Date().getFullYear();
  const {agg} = computeYearStats(year);
  const shareholders = state.settings.shareholders||[];

  const drawsInYear = state.draws.filter(d=>{
    if(d.year!=null) return Number(d.year)===year;
    const dt = toJsDate(d.date);
    return dt ? dt.getFullYear()===year : true; // undated draws counted against current year by default
  });
  const balanceData = shareholders.map(s=>{
    const earned = agg.netIncome * s.pct;
    const taken = drawsInYear.filter(d=>d.shareholder===s.name).reduce((sum,d)=>sum+(Number(d.amount)||0),0);
    return { name: s.name, earned, taken, remaining: earned - taken };
  });
  const balanceRows = balanceData.map(b=>
    `<tr><td>${escapeHtml(b.name)}</td><td class="right">${money(b.earned)}</td><td class="right">${money(b.taken)}</td><td class="right ${b.remaining<0?'neg':'pos'}">${money(b.remaining)}</td></tr>`
  ).join('');
  const totalEarned = agg.netIncome;
  const totalTaken = drawsInYear.reduce((s,d)=>s+(Number(d.amount)||0),0);
  const totalRemaining = totalEarned - totalTaken;
  const balanceCards = balanceData.map(b=>`
    <div class="balance-card">
      <div class="balance-card-name">${escapeHtml(b.name)}</div>
      <div class="balance-card-row"><span class="muted">Earned (YTD)</span><span>${money(b.earned)}</span></div>
      <div class="balance-card-row"><span class="muted">Money Taken</span><span>${money(b.taken)}</span></div>
      <div class="balance-card-row total"><span>Remaining Balance</span><span class="${b.remaining<0?'neg':'pos'}">${money(b.remaining)}</span></div>
    </div>`).join('') || `<p class="muted center">Add shareholders in Settings.</p>`;
  const balanceTotalCard = balanceData.length ? `
    <div class="balance-card total-card">
      <div class="balance-card-name">TOTAL</div>
      <div class="balance-card-row"><span class="muted">Earned (YTD)</span><span>${money(totalEarned)}</span></div>
      <div class="balance-card-row"><span class="muted">Money Taken</span><span>${money(totalTaken)}</span></div>
      <div class="balance-card-row total"><span>Remaining Balance</span><span class="${totalRemaining<0?'neg':'pos'}">${money(totalRemaining)}</span></div>
    </div>` : '';

  const logRows = state.draws.slice().sort((a,b)=>(toJsDate(b.date)||0)-(toJsDate(a.date)||0)).map(d=>`
    <tr>
      <td>${fmtDate(d.date)}</td>
      <td>${escapeHtml(d.shareholder)}</td>
      <td class="right">${money(d.amount)}</td>
      <td class="muted">${escapeHtml(d.note||'')}</td>
      <td class="row-actions"><button class="icon-btn" data-edit-draw="${d.id}">✎</button><button class="icon-btn" data-del-draw="${d.id}">🗑</button></td>
    </tr>`).join('') || `<tr><td colspan="5" class="muted center">No draws logged yet.</td></tr>`;

  return `
  <div class="card">
    <h2 class="section">Balance summary <small>${year}</small></h2>
    <div class="tbl-wrap desktop-table"><table><thead><tr><th>Shareholder</th><th class="right">Earned (YTD)</th><th class="right">Money Taken</th><th class="right">Remaining Balance</th></tr></thead>
    <tbody>${balanceRows}
    <tr style="font-weight:700"><td>TOTAL</td><td class="right">${money(totalEarned)}</td><td class="right">${money(totalTaken)}</td><td class="right">${money(totalRemaining)}</td></tr>
    </tbody></table></div>
    <div class="mobile-cards">${balanceCards}${balanceTotalCard}</div>
    <p class="muted" style="font-size:12px;margin-top:10px">A positive remaining balance is owed to the shareholder. Negative means they've taken more than earned.</p>
  </div>
  <div class="card">
    <h2 class="section">Draw log</h2>
    <button class="btn" id="addDrawBtn">+ Add draw</button>
    <div class="tbl-wrap" style="margin-top:14px"><table><thead><tr><th>Date</th><th>Shareholder</th><th class="right">Amount</th><th>Note</th><th></th></tr></thead><tbody>${logRows}</tbody></table></div>
  </div>`;
}

/* ---------------------------------------------------------------------
   Generic modal helpers
   --------------------------------------------------------------------- */
function showModal(innerHtml){
  const mr = document.getElementById('modalRoot');
  mr.innerHTML = `<div class="overlay" id="modalOverlay"><div class="modal">${innerHtml}</div></div>`;
  document.getElementById('modalOverlay').addEventListener('click',(e)=>{ if(e.target.id==='modalOverlay') closeModal(); });
}
function closeModal(){
  const mr = document.getElementById('modalRoot');
  if(mr) mr.innerHTML='';
}

/* ---------------------------------------------------------------------
   Event delegation for dynamic content per tab
   --------------------------------------------------------------------- */
function attachTabHandlers(){
  // Dashboard
  const dy = document.getElementById('dashYearSel');
  if(dy) dy.onchange = ()=>{ state.dashYear = Number(dy.value); renderApp(); };
  const dm = document.getElementById('dashMonthSel');
  if(dm) dm.onchange = ()=>{ state.dashMonth = dm.value; renderApp(); };

  // Trucks list -> detail
  root.querySelectorAll('[data-truck]').forEach(c=>c.onclick=()=>{ state.currentTruck = c.getAttribute('data-truck'); renderApp(); });
  const backBtn = document.getElementById('backToTrucks');
  if(backBtn) backBtn.onclick = ()=>{ state.currentTruck=null; renderApp(); };
  const addLoadBtn = document.getElementById('addLoadBtn');
  if(addLoadBtn) addLoadBtn.onclick = ()=>openLoadModal(state.currentTruck, null);
  root.querySelectorAll('[data-edit-load]').forEach(b=>b.onclick=()=>openLoadModal(state.currentTruck, b.getAttribute('data-edit-load')));
  root.querySelectorAll('[data-del-load]').forEach(b=>b.onclick=()=>confirmDelete('loads', b.getAttribute('data-del-load'), 'load'));

  // All Loads
  const alTruckSel = document.getElementById('alTruckSel');
  if(alTruckSel){
    updateAllLoadsResults();
    alTruckSel.onchange = ()=>{ state.allLoadsFilter.truck = alTruckSel.value; updateAllLoadsResults(); };
    const alRouteInput = document.getElementById('alRouteInput');
    if(alRouteInput) alRouteInput.oninput = ()=>{ state.allLoadsFilter.route = alRouteInput.value; updateAllLoadsResults(); };
    const alFromInput = document.getElementById('alFromInput');
    if(alFromInput) alFromInput.onchange = ()=>{ state.allLoadsFilter.from = alFromInput.value; updateAllLoadsResults(); };
    const alToInput = document.getElementById('alToInput');
    if(alToInput) alToInput.onchange = ()=>{ state.allLoadsFilter.to = alToInput.value; updateAllLoadsResults(); };
    const alClearBtn = document.getElementById('alClearBtn');
    if(alClearBtn) alClearBtn.onclick = ()=>{ state.allLoadsFilter = {truck:'',from:'',to:'',route:''}; renderApp(); };
    const alAddLoadBtn = document.getElementById('alAddLoadBtn');
    if(alAddLoadBtn) alAddLoadBtn.onclick = ()=>openLoadModal(null, null);
  }

  // Expenses
  const addExpBtn = document.getElementById('addExpBtn');
  if(addExpBtn) addExpBtn.onclick = ()=>openExpenseModal(null);
  root.querySelectorAll('[data-edit-exp]').forEach(b=>b.onclick=()=>openExpenseModal(b.getAttribute('data-edit-exp')));
  root.querySelectorAll('[data-del-exp]').forEach(b=>b.onclick=()=>confirmDelete('expenses', b.getAttribute('data-del-exp'), 'expense'));

  // Draws
  const addDrawBtn = document.getElementById('addDrawBtn');
  if(addDrawBtn) addDrawBtn.onclick = ()=>openDrawModal(null);
  root.querySelectorAll('[data-edit-draw]').forEach(b=>b.onclick=()=>openDrawModal(b.getAttribute('data-edit-draw')));
  root.querySelectorAll('[data-del-draw]').forEach(b=>b.onclick=()=>confirmDelete('draws', b.getAttribute('data-del-draw'), 'draw'));

  // Settings
  attachSettingsHandlers();
}

function confirmDelete(collection, id, label){
  showModal(`
    <h3>Delete this ${label}?</h3>
    <p class="muted">This can't be undone.</p>
    <div class="modal-actions">
      <button class="btn secondary" id="cancelModal">Cancel</button>
      <button class="btn danger" id="confirmDelBtn">Delete</button>
    </div>
  `);
  document.getElementById('cancelModal').onclick = closeModal;
  document.getElementById('confirmDelBtn').onclick = async ()=>{
    try{ await db.collection(collection).doc(id).delete(); closeModal(); }
    catch(err){ toast("Delete failed: "+err.message,'err'); }
  };
}

function attachSettingsHandlers(){
  const saveRatesBtn = document.getElementById('saveRatesBtn');
  if(saveRatesBtn) saveRatesBtn.onclick = async ()=>{
    const payload = {
      factoringRate: Number(document.getElementById('setFactoring').value)||0,
      companyGrossDefault: Number(document.getElementById('setGrossDefault').value)||0,
      perInvoiceFee: Number(document.getElementById('setInvoiceFee').value)||0,
    };
    await saveSettings(payload);
    toast("Rates saved",'ok');
  };

  const addShBtn = document.getElementById('addShBtn');
  if(addShBtn) addShBtn.onclick = ()=>{
    state.settings.shareholders = (state.settings.shareholders||[]).concat([{name:'New Shareholder', pct:0}]);
    renderApp();
  };
  const saveShBtn = document.getElementById('saveShBtn');
  if(saveShBtn) saveShBtn.onclick = async ()=>{
    const errEl = document.getElementById('shSaveErr');
    const names = root.querySelectorAll('[data-sh-name]');
    const list = Array.from(names).map(inp=>{
      const i = inp.getAttribute('data-sh-name');
      const pctInp = root.querySelector(`[data-sh-pct="${i}"]`);
      return { name: inp.value.trim(), pct: Number(pctInp.value)||0 };
    }).filter(x=>x.name);
    const total = list.reduce((s,x)=>s+Number(x.pct||0),0);
    if(list.length && Math.abs(total-1)>0.001){
      if(errEl) errEl.textContent = `Shares must add up to 100% before saving — currently ${pct(total)}. Adjust the percentages and try again.`;
      return;
    }
    if(errEl) errEl.textContent = '';
    await saveSettings({shareholders:list});
    toast("Shareholders saved",'ok');
  };
  root.querySelectorAll('[data-del-sh]').forEach(b=>b.onclick=()=>{
    const i = Number(b.getAttribute('data-del-sh'));
    const sh = state.settings.shareholders[i];
    showModal(`
      <h3>Delete shareholder${sh?': '+escapeHtml(sh.name):''}?</h3>
      <p class="muted">This can't be undone once you save. Draws already logged for this shareholder stay in the Draw log, but they'll no longer show up in the balance summary.</p>
      <div class="modal-actions">
        <button class="btn secondary" id="cancelModal">Cancel</button>
        <button class="btn danger" id="confirmDelBtn">Delete</button>
      </div>
    `);
    document.getElementById('cancelModal').onclick = closeModal;
    document.getElementById('confirmDelBtn').onclick = ()=>{
      state.settings.shareholders.splice(i,1);
      closeModal();
      renderApp();
    };
  });

  const addTruckBtn = document.getElementById('addTruckBtn');
  if(addTruckBtn) addTruckBtn.onclick = ()=>{
    const n = (state.settings.trucks||[]).length+1;
    state.settings.trucks = (state.settings.trucks||[]).concat([{id: genId(), name:'Truck '+String(n).padStart(2,'0'), pct: state.settings.companyGrossDefault||0.10}]);
    renderApp();
  };
  const saveTrucksBtn = document.getElementById('saveTrucksBtn');
  if(saveTrucksBtn) saveTrucksBtn.onclick = async ()=>{
    let anyClamped = false;
    const names = root.querySelectorAll('[data-truck-name]');
    const list = Array.from(names).map(inp=>{
      const i = inp.getAttribute('data-truck-name');
      const pctInp = root.querySelector(`[data-truck-pct="${i}"]`);
      const id = inp.getAttribute('data-truck-id') || inp.value.trim();
      const raw = Number(pctInp.value)||0;
      const clamped = Math.min(1, Math.max(0, raw));
      if(clamped!==raw) anyClamped = true;
      return { id, name: inp.value.trim(), pct: clamped };
    }).filter(x=>x.name);
    await saveSettings({trucks:list});
    toast(anyClamped ? "Trucks saved (a Co.% value outside 0–100% was clamped)" : "Trucks saved",'ok');
  };
  root.querySelectorAll('[data-del-truck]').forEach(b=>b.onclick=()=>{
    const i = Number(b.getAttribute('data-del-truck'));
    const t = state.settings.trucks[i];
    const linkedLoads = t ? state.loads.filter(l=>l.truck===t.id) : [];
    const loadsWarning = linkedLoads.length
      ? `<p style="color:var(--warn);font-size:13px">⚠ ${linkedLoads.length} load${linkedLoads.length===1?'':'s'} (${money(linkedLoads.reduce((s,l)=>s+(Number(l.rate)||0),0))} total) are logged against this truck. They'll stay in the database but become hidden from the Trucks tab and excluded from company-% calculations once this truck is removed.</p>`
      : '';
    showModal(`
      <h3>Delete truck${t?': '+escapeHtml(t.name):''}?</h3>
      <p class="muted">This can't be undone once you save.</p>
      ${loadsWarning}
      <div class="modal-actions">
        <button class="btn secondary" id="cancelModal">Cancel</button>
        <button class="btn danger" id="confirmDelBtn">Delete</button>
      </div>
    `);
    document.getElementById('cancelModal').onclick = closeModal;
    document.getElementById('confirmDelBtn').onclick = ()=>{
      state.settings.trucks.splice(i,1);
      closeModal();
      renderApp();
    };
  });

  const setPinBtn = document.getElementById('setPinBtn');
  if(setPinBtn) setPinBtn.onclick = openSetPinModal;
  const removePinBtn = document.getElementById('removePinBtn');
  if(removePinBtn) removePinBtn.onclick = async ()=>{ await saveSettings({pinHash:null}); toast("PIN removed",'ok'); };

  const importFile = document.getElementById('importFile');
  if(importFile) importFile.onchange = handleImportFile;

  const exportJsonBtn = document.getElementById('exportJsonBtn');
  if(exportJsonBtn) exportJsonBtn.onclick = exportJsonBackup;
  const exportXlsxBtn = document.getElementById('exportXlsxBtn');
  if(exportXlsxBtn) exportXlsxBtn.onclick = exportXlsxBackup;

  const disconnectBtn = document.getElementById('disconnectBtn');
  if(disconnectBtn) disconnectBtn.onclick = ()=>{
    showModal(`
      <h3>Disconnect this device?</h3>
      <p class="muted">You'll be asked to paste your Firebase config again next time. Your data stays safe in Firebase either way.</p>
      <div class="modal-actions">
        <button class="btn secondary" id="cancelModal">Cancel</button>
        <button class="btn danger" id="confirmDiscBtn">Disconnect</button>
      </div>`);
    document.getElementById('cancelModal').onclick = closeModal;
    document.getElementById('confirmDiscBtn').onclick = ()=>{ localStorage.removeItem(LS_CONFIG); location.reload(); };
  };
}

async function saveSettings(partial){
  state.settings = Object.assign({}, state.settings, partial);
  await db.collection('meta').doc('settings').set(state.settings, {merge:true});
}

function openSetPinModal(){
  showModal(`
    <h3>${state.settings.pinHash?'Change PIN':'Set a PIN'}</h3>
    <label>New PIN (4-8 digits)</label>
    <input type="password" inputmode="numeric" id="newPin" maxlength="8">
    <label>Confirm PIN</label>
    <input type="password" inputmode="numeric" id="newPin2" maxlength="8">
    <p id="pinModalErr" style="color:var(--danger);font-size:13px;min-height:16px"></p>
    <div class="modal-actions">
      <button type="button" class="btn secondary" id="cancelModal">Cancel</button>
      <button type="button" class="btn" id="savePinBtn">Save PIN</button>
    </div>
  `);
  document.getElementById('cancelModal').onclick = closeModal;
  document.getElementById('savePinBtn').onclick = async ()=>{
    const p1 = document.getElementById('newPin').value;
    const p2 = document.getElementById('newPin2').value;
    if(p1.length<4){ document.getElementById('pinModalErr').textContent='PIN must be at least 4 digits.'; return; }
    if(p1!==p2){ document.getElementById('pinModalErr').textContent="PINs don't match."; return; }
    const hash = await sha256(p1);
    await saveSettings({pinHash:hash});
    sessionStorage.setItem(LS_UNLOCK,'1');
    closeModal();
    toast("PIN saved",'ok');
  };
}

/* =========================================================================
   IMPORT FROM EXCEL (SheetJS)
   ========================================================================= */
function parseDateFlexible(v){
  if(v==null) return null;
  if(v instanceof Date) return v;
  if(typeof v === 'number'){
    const d = XLSX.SSF.parse_date_code(v);
    if(!d) return null;
    return new Date(d.y, d.m-1, d.d);
  }
  if(typeof v === 'string'){
    const parts = v.split(/[\/\-]/).map(s=>s.trim());
    if(parts.length===3 && parts[2].length===4){
      return new Date(Number(parts[2]), Number(parts[0])-1, Number(parts[1]));
    }
    const d2 = new Date(v);
    if(!isNaN(d2)) return d2;
  }
  return null;
}

function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (evt)=>{
    try{
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, {type:'array', cellDates:true});
      await runImport(wb);
    }catch(err){
      toast("Import failed: "+err.message,'err');
    }
  };
  reader.readAsArrayBuffer(file);
}

function sheetAoa(wb, name){
  if(!wb.Sheets[name]) return null;
  return XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:null});
}

async function runImport(wb){
  const summary = document.getElementById('importSummary');
  summary.innerHTML = `<div class="import-summary">Importing…</div>`;

  const settingsAoa = sheetAoa(wb, 'Settings');
  let newSettings = null;
  if(settingsAoa){
    const factoringRate = settingsAoa[2] ? settingsAoa[2][1] : undefined;
    const companyGrossDefault = settingsAoa[3] ? settingsAoa[3][1] : undefined;
    const perInvoiceFee = settingsAoa[5] ? settingsAoa[5][1] : undefined;
    const shareholders = [];
    for(let i=8;i<settingsAoa.length;i++){
      const row = settingsAoa[i];
      if(row && typeof row[0]==='string' && typeof row[1]==='number') shareholders.push({name:row[0], pct:row[1]});
      else break;
    }
    const existingTrucksByName = new Map((state.settings.trucks||[]).map(t=>[t.name, t]));
    const trucks = [];
    for(let i=2;i<settingsAoa.length;i++){
      const row = settingsAoa[i];
      if(row && row[3] && typeof row[4]==='number'){
        const tname = String(row[3]);
        const existingTruck = existingTrucksByName.get(tname);
        trucks.push({id: existingTruck ? existingTruck.id : tname, name: tname, pct: row[4]});
      }
      else if(row && !row[3]) break;
    }
    const statusOptions = [];
    for(let i=2;i<settingsAoa.length;i++){
      const row = settingsAoa[i];
      if(row && row[7]) statusOptions.push(row[7]); else if(i>2) break;
    }
    newSettings = {};
    if(factoringRate!=null) newSettings.factoringRate = factoringRate;
    if(companyGrossDefault!=null) newSettings.companyGrossDefault = companyGrossDefault;
    if(perInvoiceFee!=null) newSettings.perInvoiceFee = perInvoiceFee;
    if(shareholders.length) newSettings.shareholders = shareholders;
    if(trucks.length) newSettings.trucks = trucks;
    if(statusOptions.length) newSettings.statusOptions = statusOptions;
  }

  const truckList = (newSettings && newSettings.trucks ? newSettings.trucks : state.settings.trucks||[]);
  const truckNameToId = new Map(truckList.map(t=>[t.name, t.id]));
  const skipSheets = new Set(['Settings','Dashboard','Shareholder Draws','Expenses','TEMPLATE','Calc']);
  const existingKeys = new Set(state.loads.map(l=>l.truck+'::'+l.number));
  let importedLoads = [];
  for(const sheetName of wb.SheetNames){
    if(skipSheets.has(sheetName)) continue;
    if(!truckNameToId.has(sheetName)) continue;
    const truckId = truckNameToId.get(sheetName);
    const rows = sheetAoa(wb, sheetName);
    if(!rows) continue;
    for(let i=3;i<rows.length;i++){
      const r = rows[i];
      if(r && typeof r[0]==='number'){
        const key = truckId+'::'+r[0];
        if(existingKeys.has(key)) continue;
        const dt = parseDateFlexible(r[1]);
        importedLoads.push({
          truck: truckId,
          number: r[0],
          date: dt ? firebase.firestore.Timestamp.fromDate(dt) : null,
          year: dt ? dt.getFullYear() : new Date().getFullYear(),
          pickup: r[2]||'',
          destination: r[3]||'',
          rate: Number(r[4])||0,
          status: r[5]||'Delivered',
          month: r[6]||'',
          notes: r[7]||'',
        });
      }
    }
  }

  const eRows = sheetAoa(wb, 'Expenses');
  let importedExpenses = [];
  if(eRows){
    for(let i=1;i<eRows.length;i++){
      const r = eRows[i];
      if(r && r[0]) importedExpenses.push({month:r[0], expense:r[1]||'', amount:Number(r[2])||0, frequency:r[3]||'', year: state.dashYear || new Date().getFullYear()});
    }
  }

  const dRows = sheetAoa(wb, 'Shareholder Draws');
  let importedDraws = [];
  if(dRows){
    let headerIdx=-1;
    for(let i=0;i<dRows.length;i++){ const r=dRows[i]; if(r && r[0]==='Date' && r[1]==='Shareholder'){headerIdx=i;break;} }
    if(headerIdx>=0){
      for(let i=headerIdx+1;i<dRows.length;i++){
        const r = dRows[i];
        if(!r || !r[1]) break;
        const dt = parseDateFlexible(r[0]);
        importedDraws.push({ date: dt?firebase.firestore.Timestamp.fromDate(dt):null, year: dt?dt.getFullYear():(state.dashYear || new Date().getFullYear()), shareholder:r[1], amount:Number(r[2])||0, note:r[3]||'' });
      }
    }
  }

  // Write everything
  if(newSettings) await saveSettings(newSettings);
  const batchWrites = [];
  for(const l of importedLoads) batchWrites.push(db.collection('loads').add(l));
  for(const ex of importedExpenses) batchWrites.push(db.collection('expenses').add(ex));
  for(const d of importedDraws) batchWrites.push(db.collection('draws').add(d));
  await Promise.all(batchWrites);

  summary.innerHTML = `<div class="import-summary">
    Imported <b>${importedLoads.length}</b> loads, <b>${importedExpenses.length}</b> expenses, <b>${importedDraws.length}</b> shareholder draws.
    ${newSettings? 'Settings (trucks, shareholders, rates) updated too.':''}
  </div>`;
  toast("Import complete",'ok');
}

/* =========================================================================
   EXPORT / BACKUP
   ========================================================================= */
function exportJsonBackup(){
  const payload = { settings: state.settings, loads: state.loads, expenses: state.expenses, draws: state.draws, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  downloadBlob(blob, 'starlink-freight-backup-'+new Date().toISOString().slice(0,10)+'.json');
  recordExportTimestamp();
}

function exportXlsxBackup(){
  const wbOut = XLSX.utils.book_new();

  // Settings sheet
  const s = state.settings;
  const setAoa = [
    ['SETTINGS'],
    ['Rate Assumptions','','','Truck List','Co. Gross %'],
    ['Factoring Rate', s.factoringRate],
    ['Company Gross % (default)', s.companyGrossDefault],
    ['Per Invoice / Load Fee', s.perInvoiceFee],
    [],
    ['Shareholders'],
  ];
  (s.shareholders||[]).forEach(sh=>setAoa.push([sh.name, sh.pct]));
  const truckStart = 2;
  (s.trucks||[]).forEach((t,i)=>{
    const rowIdx = truckStart+i;
    if(!setAoa[rowIdx]) setAoa[rowIdx] = [];
    setAoa[rowIdx][3] = t.name; setAoa[rowIdx][4] = t.pct;
  });
  XLSX.utils.book_append_sheet(wbOut, XLSX.utils.aoa_to_sheet(setAoa), 'Settings');

  // Per truck sheets
  (s.trucks||[]).forEach(t=>{
    const loads = state.loads.filter(l=>l.truck===t.id).sort((a,b)=>(a.number||0)-(b.number||0));
    const aoa = [[t.name],['Load Log'],['#','Date','Pickup','Destination','Rate','Status','Month','Notes']];
    loads.forEach(l=>aoa.push([l.number, fmtDate(l.date), l.pickup, l.destination, l.rate, l.status, l.month, l.notes||'']));
    XLSX.utils.book_append_sheet(wbOut, XLSX.utils.aoa_to_sheet(aoa), t.name.slice(0,31));
  });

  // Expenses
  const expAoa = [['Month','Expense','Amount','Frequency']];
  state.expenses.forEach(e=>expAoa.push([e.month,e.expense,e.amount,e.frequency]));
  XLSX.utils.book_append_sheet(wbOut, XLSX.utils.aoa_to_sheet(expAoa), 'Expenses');

  // Draws
  const drAoa = [['Date','Shareholder','Amount','Note']];
  state.draws.forEach(d=>drAoa.push([fmtDate(d.date), d.shareholder, d.amount, d.note||'']));
  XLSX.utils.book_append_sheet(wbOut, XLSX.utils.aoa_to_sheet(drAoa), 'Shareholder Draws');

  // Dashboard snapshot (current year)
  const year = state.dashYear || new Date().getFullYear();
  const {agg, perMonth} = computeYearStats(year);
  const dashAoa = [['Month','Loads','Gross Revenue','Net Income']];
  MONTHS.forEach(mo=>dashAoa.push([mo, perMonth[mo].totalLoads, perMonth[mo].totalGross, perMonth[mo].netIncome]));
  dashAoa.push(['TOTAL', agg.totalLoads, agg.totalGross, agg.netIncome]);
  XLSX.utils.book_append_sheet(wbOut, XLSX.utils.aoa_to_sheet(dashAoa), 'Dashboard '+year);

  XLSX.writeFile(wbOut, 'starlink-freight-export-'+new Date().toISOString().slice(0,10)+'.xlsx');
  recordExportTimestamp();
}

function recordExportTimestamp(){
  const iso = new Date().toISOString();
  saveSettings({lastExportedAt: iso}).catch(()=>{}); // best-effort; not worth surfacing an error for a timestamp
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
